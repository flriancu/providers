<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Private pages: never listed by search engines (NFR-02). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Providers directory</title>
    <!-- Before the app runs: the opening line in the language chosen on this device, else the browser's. -->
    <style>
      .boot {
        margin: 2rem 1rem;
        font:
          1.1rem system-ui,
          sans-serif;
      }
      .boot-ro,
      html.ro .boot-en {
        display: none;
      }
      html.ro .boot-ro {
        display: block;
      }
    </style>
    <script>
      // NFR-11: a browser without what the app relies on (Object.hasOwn, CSS :has(), the modal
      // dialog, container queries) is older than the app supports, and is told which versions
      // work. Its own script, in syntax every browser parses, so it runs where the next one can't.
      var tooOld = false;
      try {
        tooOld =
          !Object.hasOwn ||
          !window.HTMLDialogElement ||
          !HTMLDialogElement.prototype.showModal ||
          !CSS.supports('selector(:has(*))') ||
          !CSS.supports('container-type: inline-size');
      } catch (e) {
        tooOld = true;
      }
      if (tooOld)
        document.addEventListener('DOMContentLoaded', function () {
          var ro = false;
          try {
            ro = (localStorage.getItem('providers-directory.lang') || navigator.language).toLowerCase().indexOf('ro') === 0;
          } catch (e) {}
          // Ahead of the app, not in its place: if the app runs anyway, the message stays.
          var root = document.getElementById('root');
          if (!root) return;
          root.textContent = '';
          var note = document.createElement('p');
          note.setAttribute('role', 'alert');
          note.style.cssText = 'margin: 1rem; font: 1.1rem system-ui, sans-serif';
          root.parentNode.insertBefore(note, root);
          note.textContent = ro
            ? 'Acest browser este mai vechi decât poate folosi aplicația. Folosește Chrome sau Edge 111, Firefox 121, Safari 16.4 sau o versiune mai nouă.'
            : 'This browser is older than the app can use. Use Chrome or Edge 111, Firefox 121, Safari 16.4, or newer.';
        });
    </script>
    <script>
      // Never inside another site's frame (clickjacking): a static host can't send
      // X-Frame-Options, so the page leaves the frame, or stays blank if the frame forbids that.
      if (window.top !== window.self) {
        document.documentElement.style.display = 'none';
        try {
          window.top.location = window.location.href;
        } catch {}
      }
      // If the app's own code fails to load, or loads but does not run (it does not parse in this
      // browser, it was cut short), say so with a way on (the page would stay on its opening line).
      // In the language chosen on this device, else the browser's. Other sites' scripts (Google's
      // sign-in, blocked by an extension, say) are not the app: the app handles those itself, as
      // it does its own errors once it has started (the opening line is gone).
      window.addEventListener(
        'error',
        function (e) {
          var el = e.target;
          var own = location.origin + '/';
          var notLoaded = el && el.tagName === 'SCRIPT' && el.src.indexOf(own) === 0;
          var notRun = (e.filename || '').indexOf(own) === 0 && document.querySelector('#root .boot');
          // In a browser too old for the app, the message says so (above); no reload helps.
          if (tooOld || (!notLoaded && !notRun)) return;
          var ro = false;
          try {
            ro = (localStorage.getItem('providers-directory.lang') || navigator.language).toLowerCase().indexOf('ro') === 0;
          } catch {}
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<p style="margin: 2rem 1rem 1rem; font: 1.1rem system-ui, sans-serif"></p><button type="button" style="margin: 0 1rem; font: 1.1rem system-ui, sans-serif; padding: 0.5rem 1rem"></button>';
          root.querySelector('p').textContent = ro
            ? 'Aplicația nu s-a putut încărca. Verifică legătura la internet, apoi reîncarcă pagina.'
            : 'The app could not load. Check the internet connection, then reload the page.';
          var button = root.querySelector('button');
          button.textContent = ro ? 'Reîncarcă pagina' : 'Reload the page';
          button.addEventListener('click', function () {
            location.reload();
          });
        },
        true,
      );
      try {
        if ((localStorage.getItem('providers-directory.lang') || navigator.language).toLowerCase().indexOf('ro') === 0)
          document.documentElement.classList.add('ro');
      } catch {}
      // The theme before the first paint (D-36), as src/ui/theme.ts applies it: the stored
      // choice, else the device's setting. Without this, a dark page would flash light first.
      (function () {
        var chosen = null;
        try {
          chosen = localStorage.getItem('providers-directory.theme');
        } catch {}
        var dark = chosen === 'dark' || (chosen !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p class="boot boot-en" lang="en">Opening the providers directory…</p>
      <p class="boot boot-ro" lang="ro">Se deschide catalogul de furnizori…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
